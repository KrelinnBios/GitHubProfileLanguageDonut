name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-version"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < .github/release-version)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$VERSION"; then
            tagged_commit=$(git rev-list -n 1 "$VERSION")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$VERSION already points to $tagged_commit" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already published"
          else
            gh release create "$VERSION" --verify-tag --generate-notes
          fi
